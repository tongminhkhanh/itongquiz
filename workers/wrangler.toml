# iTongQuiz Workers API Configuration
# Secrets defined in 'wrangler secret put':
# - API_SECRET_TOKEN: Shared secret for API auth

name = "itongquiz-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ed9d66ab88b8acb297031b4d22520c92"

[[d1_databases]]
binding = "DB"
database_name = "itongquiz-db"
database_id = "340c3a89-3941-43b1-bc81-fb37b8b6ac00"

[[r2_buckets]]
binding = "OG_IMAGES"
bucket_name = "phieu-og-images"

# Cho phép import .wasm (dùng bởi @resvg/resvg-wasm để render certificate PNG)
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[routes]]
pattern = "phieu.thitong.site/*"
zone_name = "thitong.site"

[[routes]]
pattern = "quiz-api.thitong.site/*"
zone_name = "thitong.site"

[vars]
CLIPROXY_API = "https://api.thitong.site/v1"
R2_PUBLIC_URL = "https://r2.thitong.site"

# Cron triggers
[triggers]
crons = [
    "0 0 * * 1",  # Every Monday at 00:00 UTC (7:00 AM ICT) - Weekly leaderboard rewards
    "* * * * *"   # Every minute - Auto-close expired live exams
]
# ========================
# Cloudflare Queues - Certificate
# ========================
[[queues.producers]]
binding = "CERTIFICATE_QUEUE"
queue = "certificate-generation"

[[queues.consumers]]
queue = "certificate-generation"
max_batch_size = 5
max_batch_timeout = 30
